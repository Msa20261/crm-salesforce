<template>
  <div
    class="kpi-card"
    data-color={colorKey}
    tabindex="0"
    role="button"
    aria-label={ariaLabel}
    onkeydown={handleKeyDown}
  >
    <div class="kpi-icon-wrap" data-color={colorKey}>
      <lightning-icon icon-name={iconName} size="small"></lightning-icon>
    </div>
    <div class="kpi-info">
      <span class="kpi-valeur">{value}</span>
      <span class="kpi-label">{label}</span>
    </div>
    <div class="kpi-sparkline" data-color={colorKey}></div>
  </div>
</template>
