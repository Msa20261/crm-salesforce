<template>
  <c-widget-card
    title="Opportunités sur comptes sous contrat actif"
    icon-name="standard:opportunity"
    erreur={erreur}
    erreur-message="Impossible de charger les opportunités. Réessayez plus tard."
    vide={estVide}
    vide-message="Aucune opportunité ouverte sur un compte sous contrat actif."
  >
    <template for:each={opportunitesAffichees} for:item="opp">
      <c-widget-item
        key={opp.id}
        data-id={opp.id}
        title={opp.nom}
        meta={opp.meta}
        trailing={opp.trailing}
        onclick={naviguerOpportunite}
      ></c-widget-item>
    </template>
  </c-widget-card>
</template>
