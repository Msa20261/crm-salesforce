<template>
  <template if:true={erreur}>
    <div class="kpi-error">
      <lightning-icon icon-name="utility:error" size="x-small"></lightning-icon>
      <span>Impossible de charger les KPI. Réessayez plus tard.</span>
    </div>
  </template>
  <template if:false={erreur}>
    <div class="kpi-container">
      <c-kpi-card
        label="Leads ce mois"
        value={kpi.leads}
        icon-name="standard:lead"
        color-key="lead"
        onclick={naviguerLeads}
      ></c-kpi-card>
      <c-kpi-card
        label="Opportunités ouvertes"
        value={kpi.opportunites}
        icon-name="standard:opportunity"
        color-key="opp"
        onclick={naviguerOpportunites}
      ></c-kpi-card>
      <c-kpi-card
        label="Tâches du jour"
        value={kpi.taches}
        icon-name="standard:task"
        color-key="tache"
        onclick={naviguerTaches}
      ></c-kpi-card>
      <c-kpi-card
        label="Comptes rendus RDV"
        value={kpi.comptesRendus}
        icon-name="standard:note"
        color-key="cr"
        onclick={naviguerComptesRendus}
      ></c-kpi-card>
      <c-kpi-card
        label="Contrats actifs"
        value={kpi.contrats}
        icon-name="standard:contract"
        color-key="contrat"
        onclick={naviguerContrats}
      ></c-kpi-card>
    </div>
  </template>
</template>
