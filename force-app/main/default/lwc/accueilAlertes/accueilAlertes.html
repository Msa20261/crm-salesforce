<template>
  <c-widget-card
    title="Alertes sur mes comptes/contrats"
    icon-name="utility:warning"
    erreur={erreur}
    erreur-message="Impossible de charger les alertes. Réessayez plus tard."
    vide={estVide}
    vide-message="Aucune alerte active sur vos comptes ou contrats."
  >
    <template for:each={alertes} for:item="alerte">
      <c-widget-item
        key={alerte.id}
        data-id={alerte.id}
        title={alerte.compte}
        meta={alerte.message}
        badge={alerte.type}
        onclick={naviguerAlerte}
      ></c-widget-item>
    </template>
  </c-widget-card>
</template>
